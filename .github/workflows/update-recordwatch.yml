name: Update RecordWatch Canada

on:
  workflow_dispatch:
    inputs:
      climate_date:
        description: Optional climate date (YYYY-MM-DD); blank reconciles the previous 3 climate dates
        required: false
        type: string
  schedule:
    - cron: '37 10,16 * * *'
      timezone: 'America/Toronto'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update and reconcile record snapshots
        env:
          CLIMATE_DATE: ${{ inputs.climate_date }}
        run: |
          set -euo pipefail

          if [ -n "$CLIMATE_DATE" ]; then
            echo "Manual single-date update: $CLIMATE_DATE"
            python scripts/update_records.py --date "$CLIMATE_DATE"
          else
            python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; today = datetime.now(ZoneInfo("America/Toronto")).date(); print("\n".join((today - timedelta(days=d)).isoformat() for d in (3, 2, 1)))' > "$RUNNER_TEMP/recordwatch_dates.txt"

            while IFS= read -r DATE; do
              echo "::group::Reconcile climate date $DATE"
              python scripts/update_records.py --date "$DATE"
              echo "::endgroup::"
            done < "$RUNNER_TEMP/recordwatch_dates.txt"
          fi

      - name: Build weekly extremes recap
        run: python scripts/build_weekly.py

      - name: Commit changed data
        run: |
          git config user.name "recordwatch-bot"
          git config user.email "recordwatch-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update RecordWatch data"
            git push
          fi
