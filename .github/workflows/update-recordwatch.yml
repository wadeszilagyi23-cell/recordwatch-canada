name: Update RecordWatch Canada

on:
  workflow_dispatch:
    inputs:
      climate_date:
        description: Optional climate date (YYYY-MM-DD); blank reconciles the previous 3 climate dates
        required: false
        type: string
  schedule:
    - cron: '37 10,16 * * *'
      timezone: 'America/Toronto'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run validation self-test
        run: python scripts/validation_self_test.py
      - name: Update and reconcile record snapshots
        env:
          CLIMATE_DATE: ${{ inputs.climate_date }}
        run: |
          set -euo pipefail

          if [ -n "$CLIMATE_DATE" ]; then

            echo "Manual single-date update: $CLIMATE_DATE"
            python scripts/update_records.py --date "$CLIMATE_DATE"

          else

            # Process yesterday first, followed by the two older
            # reconciliation dates.
            python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; today = datetime.now(ZoneInfo("America/Toronto")).date(); print("\n".join((today - timedelta(days=d)).isoformat() for d in (1, 2, 3)))' > "$RUNNER_TEMP/recordwatch_dates.txt"

            FIRST_DATE=1

            while IFS= read -r DATE; do

              echo "::group::Reconcile climate date $DATE"

              if [ "$FIRST_DATE" -eq 1 ]; then

                echo "Primary climate date: $DATE"
                echo "This update must succeed."

                python scripts/update_records.py --date "$DATE"

                FIRST_DATE=0

              else

                echo "Historical reconciliation date: $DATE"

                if python scripts/update_records.py --date "$DATE"; then

                  echo "Historical reconciliation completed for $DATE."

                else

                  echo "::warning title=Historical reconciliation deferred::$DATE could not be refreshed because the ECCC request failed. The existing RecordWatch archive has been preserved and this date will be tried again during the next scheduled run."

                fi

              fi

              echo "::endgroup::"

            done < "$RUNNER_TEMP/recordwatch_dates.txt"

          fi

      - name: Build weekly extremes recap
        run: python scripts/build_weekly.py

      - name: Commit changed data
        run: |
          git config user.name "recordwatch-bot"
          git config user.email "recordwatch-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update RecordWatch data"
            git push
          fi
